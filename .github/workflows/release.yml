# Publishing is off until the repository variable NPM_TRUSTED_PUBLISHING is set to 'true'
# (Settings > Secrets and variables > Actions > Variables). See docs/RELEASING.md.
name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    # Opt-in gate: flip the repo variable, no code change needed.
    if: vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC for trusted publishing + provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0 # full history for the ancestry check
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24 # trusted publishing needs npm >= 11.5.1
          registry-url: https://registry.npmjs.org
          # No package-manager cache here: a release must not restore a cache that other runs can write.
      - name: Require npm >= 11.5.1 (trusted publishing)
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)" \
            || { echo "::error::npm >= 11.5.1 is required for trusted publishing"; exit 1; }
      - name: Fetch origin/main for the ancestry check
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Release checks (tag matches version, tagged commit is on main, changelog, registry)
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-check.mjs --tag "$TAG" --online
      - run: pnpm install --frozen-lockfile
      # preflight = lint + typecheck + test + build + check:pack, so the tarball below is the checked build.
      - run: pnpm preflight
      # --ignore-scripts skips prepack so the tarball is exactly the build that was just checked.
      - run: npm publish --provenance --access public --ignore-scripts
