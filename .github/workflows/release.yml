# Publishing is off until the repository variable NPM_TRUSTED_PUBLISHING is set to 'true'
# (Settings > Secrets and variables > Actions > Variables). See docs/RELEASING.md.
name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  publish:
    # Opt-in gate: flip the repo variable, no code change needed.
    if: vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC for trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # trusted publishing needs npm >= 11.5.1
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Tag must match package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version v$version" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm build
      - run: node scripts/check-public.mjs --pack
      - run: npm publish --provenance --access public
