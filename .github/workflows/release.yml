# Publishing is off until the repository variable NPM_TRUSTED_PUBLISHING is set to 'true'
# (Settings > Secrets and variables > Actions > Variables). See docs/RELEASING.md.
name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    # Opt-in gate: flip the repo variable, no code change needed.
    if: vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC for trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history for the release checks
      - name: Ensure origin/main exists
        run: git fetch origin main:refs/remotes/origin/main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # trusted publishing needs npm >= 11.5.1
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Release checks
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-check.mjs --tag "$TAG" --online
      - run: pnpm install --frozen-lockfile
      - run: pnpm preflight
      - run: npm publish --provenance --access public
