name: Bug report
description: Something is not working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      {
        label: What happened,
        description: 'Do NOT paste credentials, device codes or pairing codes.',
      }
    validations: { required: true }
  - type: input
    id: versions
    attributes: { label: 'Plugin version / signalk-server version / Node version' }
  - type: textarea
    id: logs
    attributes: { label: Relevant log lines (redacted) }
